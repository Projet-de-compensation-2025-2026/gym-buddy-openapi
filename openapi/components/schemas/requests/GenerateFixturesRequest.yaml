type: object
additionalProperties: false
description: |
  FS-ADM-05. Optional counts for `POST /admin/fixtures`. Omitted fields use
  the Approved defaults in `07-Test-fixtures.md` (3 000 users, 12 000
  accepted friendships, 15 000 posts, 20 000 comments, 800 events, 4 000
  applications, 10 000 messages, 5 000 media metadata rows). CI and the
  CLI pass a tiny set. Truncate is a separate `POST /admin/fixtures/reset`
  (`--reset`). Disabled on the `prod` Spring profile.
properties:
  users:
    type: integer
    minimum: 0
    maximum: 10000
    default: 3000
  friendships:
    type: integer
    minimum: 0
    maximum: 50000
    default: 12000
    description: Accepted friendships. Clamped to the complete graph of `users`.
  posts:
    type: integer
    minimum: 0
    maximum: 50000
    default: 15000
  comments:
    type: integer
    minimum: 0
    maximum: 80000
    default: 20000
  events:
    type: integer
    minimum: 0
    maximum: 5000
    default: 800
  applications:
    type: integer
    minimum: 0
    maximum: 20000
    default: 4000
  messages:
    type: integer
    minimum: 0
    maximum: 50000
    default: 10000
  media:
    type: integer
    minimum: 0
    maximum: 20000
    default: 5000
    description: Metadata rows. Reuse about 10 stock MinIO objects; do not store unique JPEGs.
