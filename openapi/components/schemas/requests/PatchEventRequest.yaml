type: object
additionalProperties: false
description: |
  FS-EVT-09. Organizer only. Place/time before start. If anyone is accepted,
  the event is flagged `updatedAfterAccept`. Other callers get NOT_FOUND.
properties:
  title:
    type: string
    minLength: 1
    maxLength: 120
  description:
    type: [string, "null"]
    maxLength: 2000
  activity:
    type: string
    minLength: 2
    maxLength: 32
  place:
    type: string
    minLength: 1
    maxLength: 200
  lat:
    type: [number, "null"]
    format: double
    minimum: -90
    maximum: 90
  lng:
    type: [number, "null"]
    format: double
    minimum: -180
    maximum: 180
  startsAt:
    type: string
    format: date-time
  durationMin:
    type: integer
    minimum: 1
    maximum: 1440
  tags:
    type: array
    maxItems: 8
    items:
      type: string
      minLength: 1
      maxLength: 32
  coverMediaId:
    type: [string, "null"]
    format: uuid
  inviteeIds:
    type: array
    items:
      type: string
      format: uuid
