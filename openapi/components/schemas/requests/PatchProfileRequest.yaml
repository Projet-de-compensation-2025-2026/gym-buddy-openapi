type: object
additionalProperties: false
description: |
  Owner-only partial update (FS-PROF-02, FS-PROF-06). JSON merge: omitted fields
  stay unchanged. JSON `null` on a nullable scalar (bio, city, lat, lng,
  experienceLevel, avatarMediaId) clears it. Send `sports: []` or
  `preferredWindows: []` to clear those lists; omit the key to keep them.
  Handle change must remain unique (FS-ACCT-02). Avatar bytes are the media ticket.
  Unknown `experienceLevel` values are VALIDATION, not silently null.
properties:
  handle:
    type: string
    minLength: 1
    pattern: "^[^@]+$"
    description: |
      Unique public identifier, case-insensitive (FS-ACCT-02). Must not contain
      `@` and must not equal the account email (VALIDATION).
  displayName:
    type: string
    minLength: 1
  bio:
    type: [string, "null"]
  visibility:
    type: string
    enum: [public, private]
  sports:
    type: array
    maxItems: 12
    items:
      type: string
      minLength: 2
      maxLength: 32
    description: Omitted keeps the current list. `[]` clears it.
  experienceLevel:
    type: [string, "null"]
    enum: [beginner, intermediate, advanced]
    description: |
      Omitted keeps the current value. JSON null clears it. Values other than
      beginner, intermediate, or advanced are VALIDATION.
  city:
    type: [string, "null"]
  lat:
    type: [number, "null"]
    format: double
    minimum: -90
    maximum: 90
  lng:
    type: [number, "null"]
    format: double
    minimum: -180
    maximum: 180
  preferredWindows:
    type: array
    maxItems: 14
    items:
      $ref: ../entities/PreferredWindow.yaml
    description: Omitted keeps the current list. `[]` clears it.
  avatarMediaId:
    type: [string, "null"]
    format: uuid
    description: Placeholder until the media ticket. Do not invent a local upload path.
