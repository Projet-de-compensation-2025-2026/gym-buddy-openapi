type: object
additionalProperties: false
description: |
  Owner-only partial update (FS-PROF-02, FS-PROF-06). Omitted fields stay unchanged.
  Handle change must remain unique (FS-ACCT-02). Avatar bytes are the media ticket.
properties:
  handle:
    type: string
    minLength: 1
    description: Unique public identifier, case-insensitive (FS-ACCT-02).
  displayName:
    type: string
    minLength: 1
  bio:
    type: [string, "null"]
  visibility:
    type: string
    enum: [public, private]
  sports:
    type: array
    maxItems: 12
    items:
      type: string
      minLength: 2
      maxLength: 32
  experienceLevel:
    type: [string, "null"]
    enum: [beginner, intermediate, advanced, null]
  city:
    type: [string, "null"]
  lat:
    type: [number, "null"]
    format: double
    minimum: -90
    maximum: 90
  lng:
    type: [number, "null"]
    format: double
    minimum: -180
    maximum: 180
  preferredWindows:
    type: array
    maxItems: 14
    items:
      $ref: ../entities/PreferredWindow.yaml
  avatarMediaId:
    type: [string, "null"]
    format: uuid
    description: Placeholder until the media ticket. Do not invent a local upload path.
