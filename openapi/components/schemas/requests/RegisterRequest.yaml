type: object
additionalProperties: false
required: [email, handle, password, displayName]
properties:
  email:
    type: string
    format: email
    description: Unique case-insensitively (CITEXT).
  handle:
    type: string
    minLength: 1
    pattern: "^[^@]+$"
    description: |
      Unique public identifier, case-insensitive. Must not contain `@` and
      must not equal `email` (VALIDATION).
  password:
    type: string
    format: password
    writeOnly: true
    minLength: 10
    description: At least 10 characters; must not equal email or handle. Stored as Argon2id.
  displayName:
    type: string
    minLength: 1
    description: Profile display name.
