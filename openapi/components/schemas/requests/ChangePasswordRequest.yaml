type: object
additionalProperties: false
required: [currentPassword, newPassword]
description: |
  FS-ACCT-05. `newPassword` follows FS-ACCT-03 (≥ 10 characters, not equal to
  email or handle). Wrong `currentPassword` is FORBIDDEN; the hash is unchanged.
properties:
  currentPassword:
    type: string
    format: password
    writeOnly: true
    minLength: 1
  newPassword:
    type: string
    format: password
    writeOnly: true
    minLength: 10
    description: At least 10 characters; must not equal email or handle. Stored as Argon2id.
