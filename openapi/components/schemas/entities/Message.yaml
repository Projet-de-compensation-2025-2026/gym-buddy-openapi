type: object
additionalProperties: false
required: [id, conversationId, senderId, type, createdAt, deleted]
description: |
  Private message (FS-MSG-03..08). `type` is `text`, `image`, or `audio`.
  Text body is 1–4000 characters. Image/audio reference one `mediaId`
  (`kind=message`). Author delete within 10 minutes tombstones `body` as
  `message deleted` and sets `deleted`; the original body and media are never
  returned afterwards. Signed bytes are fetched via GET /media/{id}/url.
properties:
  id:
    type: string
    format: uuid
  conversationId:
    type: string
    format: uuid
  senderId:
    type: string
    format: uuid
  type:
    type: string
    enum: [text, image, audio]
  body:
    type: [string, "null"]
    maxLength: 4000
    description: |
      Text payload, optional caption on image, or the tombstone
      `message deleted` when `deleted` is true.
  mediaId:
    type: [string, "null"]
    format: uuid
  createdAt:
    type: string
    format: date-time
  deleted:
    type: boolean
    description: True after the sender tombstones the message.
