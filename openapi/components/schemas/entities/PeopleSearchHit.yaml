type: object
additionalProperties: false
required: [handle, displayName, visibility, sports, friendState]
description: |
  People search card (FS-SRCH-01..08). Always a profile the caller may see
  (`public`, self, or accepted friend). Private strangers are omitted, not
  stubbed. `matchReason` is present only when `debug=true` (staff / tests).
properties:
  handle:
    type: string
    minLength: 1
  displayName:
    type: string
  visibility:
    type: string
    enum: [public, private]
  avatarMediaId:
    type: [string, "null"]
    format: uuid
  city:
    type: [string, "null"]
  sports:
    type: array
    maxItems: 12
    items:
      type: string
      minLength: 2
      maxLength: 32
  experienceLevel:
    type: [string, "null"]
    enum: [beginner, intermediate, advanced, null]
  distanceKm:
    type: [number, "null"]
    format: double
    minimum: 0
    description: Great-circle kilometres from the viewer when both have coordinates.
  friendState:
    type: string
    enum: [friends, pending, none]
    description: Accepted pair, outstanding request either way, or neither.
  matchReason:
    type: [string, "null"]
    description: Debug-only. Which predicates matched (text, sports, city, geo, social).
