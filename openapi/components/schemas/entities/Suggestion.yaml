type: object
additionalProperties: false
required: [userId, handle, displayName, view, sports, mutualFriends, reason]
description: |
  One friend suggestion card (FS-SUGG-01..03, FS-SUGG-06). `reason` is the
  explainable primary feature in plain language. `view=stub` is a private
  stranger: initials for `displayName`, no city, sports may list shared tags
  used in scoring. Mutual-friends count is allowed on a stub.
properties:
  userId:
    type: string
    format: uuid
  handle:
    type: string
    minLength: 1
  displayName:
    type: string
    description: Full name on a full view. Initials only on a stub.
  view:
    type: string
    enum: [full, stub]
  sports:
    type: array
    maxItems: 12
    items:
      type: string
      minLength: 2
      maxLength: 32
    description: Shared sports chips. Empty when none overlap.
  city:
    type: [string, "null"]
    description: Present on a full view when the candidate city is set.
  mutualFriends:
    type: integer
    minimum: 0
    description: Count of accepted friends in common. 0 when none.
  reason:
    type: string
    minLength: 1
    description: |
      Primary score reason (largest w_i * feature_i). Examples:
      "3 mutual friends", "same gym times", "near you", a shared sport name.
  avatarMediaId:
    type: [string, "null"]
    format: uuid
