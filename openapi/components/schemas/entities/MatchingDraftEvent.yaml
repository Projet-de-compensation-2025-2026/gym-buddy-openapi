type: object
additionalProperties: false
required: [activity, startsAt, durationMin, capacity, visibility]
description: |
  Proposed instant session for a weekly match (FS-MATCH-03). Draft,
  private invitation for the matched peer, capacity 1. `id` is set when an
  events row exists; the matched peer applies and the organizer accepts
  through the events UI.
properties:
  id:
    type: [string, "null"]
    format: uuid
  activity:
    type: string
    minLength: 2
    maxLength: 32
  startsAt:
    type: string
    format: date-time
    description: Start of the overlapping preferred window (UTC); the whole session fits within that window.
  durationMin:
    type: integer
    minimum: 1
    maximum: 1440
  capacity:
    type: integer
    minimum: 1
    maximum: 1
    description: Always 1 (the matched buddy occupies the only seat).
  visibility:
    type: string
    enum: [friends, private]
    description: New matches create a private event inviting only the matched peer. Friends is retained for older matches.
