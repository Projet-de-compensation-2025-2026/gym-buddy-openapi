type: object
additionalProperties: false
required: [id, email, handle, displayName, role]
properties:
  id:
    type: string
    format: uuid
  email:
    type: string
    format: email
  handle:
    type: string
  displayName:
    type: string
  role:
    type: string
    enum: [member, moderator, admin]
    description: First registered user may be `admin` (bootstrap); later users are `member`.
