type: object
additionalProperties: false
required: [error]
properties:
  error:
    type: object
    additionalProperties: false
    required: [code, message]
    properties:
      code:
        type: string
        enum:
          - UNAUTHENTICATED
          - FORBIDDEN
          - NOT_FOUND
          - CONFLICT
          - VALIDATION
          - PAYLOAD_TOO_LARGE
          - QUOTA_EXCEEDED
      message:
        type: string
      details:
        type: array
        items:
          $ref: ./ErrorDetail.yaml
