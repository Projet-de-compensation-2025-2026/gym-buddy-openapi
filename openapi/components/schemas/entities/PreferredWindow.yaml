type: object
additionalProperties: false
required: [weekday, start, end]
description: |
  One preferred training window. `weekday` is ISO-style 0=Sunday … 6=Saturday.
  Times are `HH:MM` 24-hour local clock (FS-PROF-01). Max 14 windows on a profile.
properties:
  weekday:
    type: integer
    minimum: 0
    maximum: 6
  start:
    type: string
    pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
    example: "06:00"
  end:
    type: string
    pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
    example: "08:00"
