SetRefreshCookie:
  description: |
    Refresh JWT. HttpOnly; Secure; SameSite=None; Partitioned; Path=/api/v1/auth.
    SameSite=None so a credentialed GitHub Pages XHR can send the cookie.
    Partitioned (CHIPS) for Chromium third-party cookie partitions.
    The access token is never set as a cookie.
  schema:
    type: string
    examples:
      - refresh=eyJhbGciOiJIUzI1NiJ9.eyJ0eXAiOiJyZWZyZXNoIn0.example; HttpOnly; Secure; SameSite=None; Partitioned; Path=/api/v1/auth; Max-Age=1209600
ClearRefreshCookie:
  description: Clears the refresh cookie after the jti is denylisted in Redis.
  schema:
    type: string
    examples:
      - refresh=; HttpOnly; Secure; SameSite=None; Partitioned; Path=/api/v1/auth; Max-Age=0
