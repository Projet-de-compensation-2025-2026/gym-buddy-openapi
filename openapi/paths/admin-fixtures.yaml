generate:
  post:
    operationId: postAdminFixtures
    tags: [Admin]
    summary: Generate deterministic test fixtures
    description: |
      FS-ADM-05. Admin only. Disabled on the `prod` Spring profile
      (FORBIDDEN). Moderators get FORBIDDEN. Members get NOT_FOUND.
      Datafaker factories use seed `FIXTURE_SEED=20260813`. Omitted body
      fields use the Approved defaults (3 000 users, 12 000 accepted
      friendships, 15 000 posts, 20 000 comments, 800 events, 4 000
      applications, 10 000 messages, 5 000 media metadata rows). Media
      metadata reuses about 10 stock MinIO objects. Does not truncate;
      call `POST /admin/fixtures/reset` first (`--reset`). Writes
      `audit_events`.
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: ../components/schemas/requests/GenerateFixturesRequest.yaml
          examples:
            defaults:
              summary: Approved demo magnitude
              value: {}
            tiny:
              summary: Integration / CI tens of rows
              value:
                users: 12
                friendships: 20
                posts: 15
                comments: 20
                events: 5
                applications: 8
                messages: 10
                media: 12
    responses:
      "204":
        description: Fixtures generated.
      "401":
        description: Missing or invalid access token (UNAUTHENTICATED).
        content:
          application/json:
            schema:
              $ref: ../components/schemas/entities/ErrorResponse.yaml
      "403":
        description: Caller is not admin, or Spring profile is prod (FORBIDDEN).
        content:
          application/json:
            schema:
              $ref: ../components/schemas/entities/ErrorResponse.yaml
      "404":
        description: Caller is not staff (NOT_FOUND).
        content:
          application/json:
            schema:
              $ref: ../components/schemas/entities/ErrorResponse.yaml
reset:
  post:
    operationId: postAdminFixturesReset
    tags: [Admin]
    summary: Truncate fixture data
    description: |
      FS-ADM-05. Admin only, non-`prod`, `--reset` equivalent. Disabled on
      the `prod` Spring profile (FORBIDDEN). Moderators get FORBIDDEN.
      Members get NOT_FOUND. Truncates domain rows. The calling admin row
      is preserved so the session stays valid. Named demo accounts are
      recreated by a later generate. Writes `audit_events`.
    responses:
      "204":
        description: Domain tables truncated.
      "401":
        description: Missing or invalid access token (UNAUTHENTICATED).
        content:
          application/json:
            schema:
              $ref: ../components/schemas/entities/ErrorResponse.yaml
      "403":
        description: Caller is not admin, or Spring profile is prod (FORBIDDEN).
        content:
          application/json:
            schema:
              $ref: ../components/schemas/entities/ErrorResponse.yaml
      "404":
        description: Caller is not staff (NOT_FOUND).
        content:
          application/json:
            schema:
              $ref: ../components/schemas/entities/ErrorResponse.yaml
