collection:
  get:
    operationId: getAdminContent
    tags: [Admin]
    summary: List hideable content for staff
    description: |
      FS-ADM-03. Staff. Lists posts, comments, events, or media the caller
      can hide or unhide, including hidden rows and `hiddenReason`. Members
      get NOT_FOUND (do not advertise staff routes). Cursor `after` is
      opaque (`page.next`). Default size 20, max 50.
    parameters:
      - name: type
        in: query
        required: true
        description: Content kind to list.
        schema:
          type: string
          enum: [post, comment, event, media]
      - name: q
        in: query
        description: Search summary, author handle, or id.
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: hidden
        in: query
        description: When set, keep only hidden (`true`) or visible (`false`) rows.
        schema:
          type: boolean
      - name: after
        in: query
        description: Opaque cursor from a previous `page.next`.
        schema:
          type: string
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
    responses:
      "200":
        description: Page of content rows.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/entities/AdminContentPage.yaml
      "401":
        description: Missing or invalid access token (UNAUTHENTICATED).
        content:
          application/json:
            schema:
              $ref: ../components/schemas/entities/ErrorResponse.yaml
      "404":
        description: Caller is not staff (NOT_FOUND).
        content:
          application/json:
            schema:
              $ref: ../components/schemas/entities/ErrorResponse.yaml
      "422":
        description: Invalid type, size, or cursor (VALIDATION).
        content:
          application/json:
            schema:
              $ref: ../components/schemas/entities/ErrorResponse.yaml
hide:
  parameters:
    - name: type
      in: path
      required: true
      description: Content kind.
      schema:
        type: string
        enum: [post, comment, event, media]
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  post:
    operationId: postAdminContentTypeIdHide
    tags: [Admin]
    summary: Hide content from members
    description: |
      FS-ADM-03. Staff. Hide is not a member delete: members see NOT_FOUND;
      staff still see the row plus reason. Missing reason is VALIDATION.
      Members calling this path get NOT_FOUND. Writes `audit_events`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/requests/HideContentRequest.yaml
          examples:
            spam:
              value:
                reason: spam / solicitation
    responses:
      "204":
        description: Content hidden.
      "401":
        description: Missing or invalid access token (UNAUTHENTICATED).
        content:
          application/json:
            schema:
              $ref: ../components/schemas/entities/ErrorResponse.yaml
      "404":
        description: Unknown type/id or caller is not staff (NOT_FOUND).
        content:
          application/json:
            schema:
              $ref: ../components/schemas/entities/ErrorResponse.yaml
      "422":
        description: Missing hide reason (VALIDATION).
        content:
          application/json:
            schema:
              $ref: ../components/schemas/entities/ErrorResponse.yaml
unhide:
  parameters:
    - name: type
      in: path
      required: true
      schema:
        type: string
        enum: [post, comment, event, media]
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  post:
    operationId: postAdminContentTypeIdUnhide
    tags: [Admin]
    summary: Restore hidden content
    description: |
      FS-ADM-03. Staff. Clears `hidden_at` / `hidden_reason`. Members calling
      this path get NOT_FOUND. Writes `audit_events`.
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: ../components/schemas/requests/StaffReasonRequest.yaml
    responses:
      "204":
        description: Content visible to members again.
      "401":
        description: Missing or invalid access token (UNAUTHENTICATED).
        content:
          application/json:
            schema:
              $ref: ../components/schemas/entities/ErrorResponse.yaml
      "404":
        description: Unknown type/id or caller is not staff (NOT_FOUND).
        content:
          application/json:
            schema:
              $ref: ../components/schemas/entities/ErrorResponse.yaml
