openapi: 3.1.0
info:
  title: Gym Buddy API
  version: 0.1.0
  description: Canonical HTTP contract. Expand this file; do not treat a running Spring /v3/api-docs as source of truth.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      description: Process is up. Unauthenticated. Does not check dependencies.
      security: []
      responses:
        "200":
          description: Process is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe
      description: PostgreSQL and object storage are reachable. Unauthenticated.
      security: []
      responses:
        "200":
          description: PostgreSQL and object storage are reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: PostgreSQL or object storage is not reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          examples:
            - ok
            - unavailable
