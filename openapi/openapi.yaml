openapi: 3.1.0
info:
  title: Gym Buddy API
  version: 0.1.0
  description: |
    Canonical HTTP contract. Edit this $ref tree. Generators read
    `openapi/openapi.yaml` on a tagged package checkout (or a develop SHA
    pin until the next 0.1.x tag). Do not treat a running Spring
    /v3/api-docs as source of truth.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Sign-up, sign-in, refresh, log-out, password change, and close account (FS-ACCT-01..07).
  - name: Profiles
    description: Public and private member profiles (FS-PROF-01..07).
  - name: Friends
    description: Friend requests, accepted pairs, and blocks (FS-FRND-01..08).
paths:
  /healthz:
    $ref: ./paths/health.yaml#/healthz
  /readyz:
    $ref: ./paths/health.yaml#/readyz
  /auth/register:
    $ref: ./paths/auth.yaml#/register
  /auth/login:
    $ref: ./paths/auth.yaml#/login
  /auth/refresh:
    $ref: ./paths/auth.yaml#/refresh
  /auth/logout:
    $ref: ./paths/auth.yaml#/logout
  /auth/password:
    $ref: ./paths/auth.yaml#/password
  /me/close:
    $ref: ./paths/me.yaml#/close
  /profiles/me:
    $ref: ./paths/profiles.yaml#/me
  /profiles/{handle}:
    $ref: ./paths/profiles.yaml#/byHandle
  /friendships:
    $ref: ./paths/friendships.yaml#/collection
  /friendships/{id}/accept:
    $ref: ./paths/friendships.yaml#/accept
  /friendships/{id}/decline:
    $ref: ./paths/friendships.yaml#/decline
  /friendships/{id}:
    $ref: ./paths/friendships.yaml#/item
  /blocks:
    $ref: ./paths/blocks.yaml#/collection
  /blocks/{userId}:
    $ref: ./paths/blocks.yaml#/item
components:
  securitySchemes:
    bearerAuth:
      $ref: ./components/securitySchemes.yaml#/bearerAuth
    refreshCookie:
      $ref: ./components/securitySchemes.yaml#/refreshCookie
  headers:
    SetRefreshCookie:
      $ref: ./components/headers.yaml#/SetRefreshCookie
    ClearRefreshCookie:
      $ref: ./components/headers.yaml#/ClearRefreshCookie
  schemas:
    HealthStatus:
      $ref: ./components/schemas/entities/HealthStatus.yaml
    RegisterRequest:
      $ref: ./components/schemas/requests/RegisterRequest.yaml
    LoginRequest:
      $ref: ./components/schemas/requests/LoginRequest.yaml
    ChangePasswordRequest:
      $ref: ./components/schemas/requests/ChangePasswordRequest.yaml
    CloseAccountRequest:
      $ref: ./components/schemas/requests/CloseAccountRequest.yaml
    PatchProfileRequest:
      $ref: ./components/schemas/requests/PatchProfileRequest.yaml
    CreateFriendshipRequest:
      $ref: ./components/schemas/requests/CreateFriendshipRequest.yaml
    CreateBlockRequest:
      $ref: ./components/schemas/requests/CreateBlockRequest.yaml
    RegisteredUser:
      $ref: ./components/schemas/entities/RegisteredUser.yaml
    AccessTokenResponse:
      $ref: ./components/schemas/responses/AccessTokenResponse.yaml
    Profile:
      $ref: ./components/schemas/entities/Profile.yaml
    PreferredWindow:
      $ref: ./components/schemas/entities/PreferredWindow.yaml
    Friendship:
      $ref: ./components/schemas/entities/Friendship.yaml
    FriendshipPeer:
      $ref: ./components/schemas/entities/FriendshipPeer.yaml
    FriendshipPage:
      $ref: ./components/schemas/entities/FriendshipPage.yaml
    Page:
      $ref: ./components/schemas/entities/Page.yaml
    ErrorResponse:
      $ref: ./components/schemas/entities/ErrorResponse.yaml
    ErrorDetail:
      $ref: ./components/schemas/entities/ErrorDetail.yaml
