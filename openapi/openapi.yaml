openapi: 3.1.0
info:
  title: Gym Buddy API
  version: 0.1.0
  description: |
    Canonical HTTP contract. Edit this $ref tree. Generators read
    `openapi/openapi.yaml` on a tagged package checkout (or a develop SHA
    pin until the next 0.1.x tag). Do not treat a running Spring
    /v3/api-docs as source of truth.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Sign-up, sign-in, refresh, log-out, password change, and close account (FS-ACCT-01..07).
  - name: Profiles
    description: Public and private member profiles (FS-PROF-01..07).
  - name: Friends
    description: Friend requests, accepted pairs, and blocks (FS-FRND-01..08).
  - name: Media
    description: Disk-safe uploads and controlled file access (FS-MED-01..09).
  - name: Posts
    description: Posts, likes, and reposts (FS-POST-01..08).
  - name: Comments
    description: Nested comments on posts (FS-CMT-01..07). Max depth 4 (root = 0).
paths:
  /healthz:
    $ref: ./paths/health.yaml#/healthz
  /readyz:
    $ref: ./paths/health.yaml#/readyz
  /auth/register:
    $ref: ./paths/auth.yaml#/register
  /auth/login:
    $ref: ./paths/auth.yaml#/login
  /auth/refresh:
    $ref: ./paths/auth.yaml#/refresh
  /auth/logout:
    $ref: ./paths/auth.yaml#/logout
  /auth/password:
    $ref: ./paths/auth.yaml#/password
  /me/close:
    $ref: ./paths/me.yaml#/close
  /profiles/me:
    $ref: ./paths/profiles.yaml#/me
  /profiles/{handle}:
    $ref: ./paths/profiles.yaml#/byHandle
  /friendships:
    $ref: ./paths/friendships.yaml#/collection
  /friendships/{id}/accept:
    $ref: ./paths/friendships.yaml#/accept
  /friendships/{id}/decline:
    $ref: ./paths/friendships.yaml#/decline
  /friendships/{id}:
    $ref: ./paths/friendships.yaml#/item
  /blocks:
    $ref: ./paths/blocks.yaml#/collection
  /blocks/{userId}:
    $ref: ./paths/blocks.yaml#/item
  /media:
    $ref: ./paths/media.yaml#/collection
  /media/{id}/url:
    $ref: ./paths/media.yaml#/url
  /media/{id}:
    $ref: ./paths/media.yaml#/item
  /posts:
    $ref: ./paths/posts.yaml#/collection
  /posts/{id}:
    $ref: ./paths/posts.yaml#/item
  /posts/{id}/reposts:
    $ref: ./paths/posts.yaml#/reposts
  /posts/{id}/like:
    $ref: ./paths/posts.yaml#/like
  /posts/{id}/likes:
    $ref: ./paths/posts.yaml#/likes
  /posts/{id}/comments:
    $ref: ./paths/comments.yaml#/onPost
  /comments/{id}/replies:
    $ref: ./paths/comments.yaml#/replies
  /comments/{id}:
    $ref: ./paths/comments.yaml#/item
  /comments/{id}/like:
    $ref: ./paths/comments.yaml#/like
components:
  securitySchemes:
    bearerAuth:
      $ref: ./components/securitySchemes.yaml#/bearerAuth
    refreshCookie:
      $ref: ./components/securitySchemes.yaml#/refreshCookie
  headers:
    SetRefreshCookie:
      $ref: ./components/headers.yaml#/SetRefreshCookie
    ClearRefreshCookie:
      $ref: ./components/headers.yaml#/ClearRefreshCookie
  schemas:
    HealthStatus:
      $ref: ./components/schemas/entities/HealthStatus.yaml
    RegisterRequest:
      $ref: ./components/schemas/requests/RegisterRequest.yaml
    LoginRequest:
      $ref: ./components/schemas/requests/LoginRequest.yaml
    ChangePasswordRequest:
      $ref: ./components/schemas/requests/ChangePasswordRequest.yaml
    CloseAccountRequest:
      $ref: ./components/schemas/requests/CloseAccountRequest.yaml
    PatchProfileRequest:
      $ref: ./components/schemas/requests/PatchProfileRequest.yaml
    CreateFriendshipRequest:
      $ref: ./components/schemas/requests/CreateFriendshipRequest.yaml
    CreateBlockRequest:
      $ref: ./components/schemas/requests/CreateBlockRequest.yaml
    CreateMediaRequest:
      $ref: ./components/schemas/requests/CreateMediaRequest.yaml
    CreatePostRequest:
      $ref: ./components/schemas/requests/CreatePostRequest.yaml
    PatchPostRequest:
      $ref: ./components/schemas/requests/PatchPostRequest.yaml
    CreateCommentRequest:
      $ref: ./components/schemas/requests/CreateCommentRequest.yaml
    CreateMediaResponse:
      $ref: ./components/schemas/responses/CreateMediaResponse.yaml
    MediaUrlResponse:
      $ref: ./components/schemas/responses/MediaUrlResponse.yaml
    RegisteredUser:
      $ref: ./components/schemas/entities/RegisteredUser.yaml
    AccessTokenResponse:
      $ref: ./components/schemas/responses/AccessTokenResponse.yaml
    Profile:
      $ref: ./components/schemas/entities/Profile.yaml
    PreferredWindow:
      $ref: ./components/schemas/entities/PreferredWindow.yaml
    Friendship:
      $ref: ./components/schemas/entities/Friendship.yaml
    FriendshipPeer:
      $ref: ./components/schemas/entities/FriendshipPeer.yaml
    FriendshipPage:
      $ref: ./components/schemas/entities/FriendshipPage.yaml
    Post:
      $ref: ./components/schemas/entities/Post.yaml
    PostAuthor:
      $ref: ./components/schemas/entities/PostAuthor.yaml
    PostLiker:
      $ref: ./components/schemas/entities/PostLiker.yaml
    PostLikerPage:
      $ref: ./components/schemas/entities/PostLikerPage.yaml
    Comment:
      $ref: ./components/schemas/entities/Comment.yaml
    CommentPage:
      $ref: ./components/schemas/entities/CommentPage.yaml
    Page:
