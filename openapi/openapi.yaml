openapi: 3.1.0
info:
  title: Gym Buddy API
  version: 0.1.0
  description: |
    Canonical HTTP contract. Edit this $ref tree. Generators read
    `openapi/openapi.yaml` on a tagged package checkout (or a develop SHA
    pin until the next 0.1.x tag). Do not treat a running Spring
    /v3/api-docs as source of truth.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Sign-up, sign-in, refresh, log-out, password change, and close account (FS-ACCT-01..07).
  - name: Profiles
    description: Public and private member profiles (FS-PROF-01..07).
  - name: Friends
    description: Friend requests, accepted pairs, and blocks (FS-FRND-01..08).
  - name: Media
    description: Disk-safe uploads and controlled file access (FS-MED-01..09).
  - name: Posts
    description: Posts, likes, and reposts (FS-POST-01..08).
  - name: Comments
    description: Nested comments on posts (FS-CMT-01..07). Max depth 4 (root = 0).
  - name: Feed
    description: Friends news feed of posts and reposts (FS-FEED-01..06).
  - name: Events
    description: Instant and recurring training events, applications, and capacity (FS-EVT-01..13).
  - name: Search
    description: Parameterized people and event search (FS-SRCH-01..08).
  - name: Suggestions
    description: Personalized friend suggestions (FS-SUGG-01..07).
  - name: Matching
    description: Weekly buddy matching opt-in and proposed pair (FS-MATCH-01..03).
  - name: Messaging
    description: Private direct messages with text, images, and audio (FS-MSG-01..10).
  - name: Admin
    description: Staff back-office (FS-ADM-01..09, FS-ACCT-08/09). Members get NOT_FOUND.
  - name: Reports
    description: Member reports of users, posts, comments, or events (FS-ADM-07).
