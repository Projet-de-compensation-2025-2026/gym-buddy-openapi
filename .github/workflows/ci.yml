name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Format (apply)
        run: bash .github/scripts/ci/format.sh --write

      - name: Commit format changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- openapi .github
          if git diff --cached --quiet; then
            echo "No format changes"
          else
            git commit -m "style: apply formatter"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          fi

      - name: Test
        run: bash .github/scripts/ci/test.sh

      - name: Smoke (spec must respond)
        run: bash .github/scripts/ci/smoke.sh
