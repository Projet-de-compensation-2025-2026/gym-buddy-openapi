name: Deploy

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      version:
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    name: pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage spec
        run: |
          mkdir -p _site
          cp -a openapi/. _site/
          if [[ -f _site/openapi.yaml ]]; then
            printf '%s\n' '<!doctype html><meta charset="utf-8"><title>Gym Buddy API</title><h1>Gym Buddy API</h1><p>Target generators: <a href="openapi.yaml">openapi.yaml</a> ($ref tree). Pin a git tag such as <code>v0.1.0</code>.</p><p>Today&rsquo;s service fetch file (until #47): <a href="bundled.yaml">bundled.yaml</a>. Not the target source of truth.</p>' > _site/index.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
